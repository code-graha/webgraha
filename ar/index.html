<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Point your camera at the WebGraha card to bring it to life in AR.">
<meta name="robots" content="noindex">
<title>WebGraha — AR Card</title>

<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/vendor/fontawesome/css/all.min.css">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" crossorigin="anonymous"></script>

<style>
  :root {
    --wg-navy-deep: #0a1128;
    --wg-navy-mid: #131f45;
    --wg-navy: #1c2c5c;
    --wg-ink: #e2e8f0;
    --wg-muted: #93a1b8;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  a-scene { width: 100%; height: 100%; }

  /* MindAR's own DOM video is left running for tracking input only — the
     camera-video-backdrop component (see the script below) renders the feed
     as a texture inside the WebGL canvas instead, so this native layer never
     needs to be visually composited by the browser. Hidden unconditionally
     (not just on devices where that compositing is known to fail) so the
     visible result is identical everywhere. */
  body > video { opacity: 0 !important; }

  /* Boot panel: NEVER an opaque full-screen background, even while showing —
     only a small floating toast near the bottom, so a slow/stuck hide
     transition can never black out a camera feed that's actually working.
     pointer-events stay off unconditionally for the same reason. */
  #boot-panel {
    position: fixed; inset: 0; z-index: 900;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 14px; padding: 0 32px 56px;
    background: transparent;
    color: var(--wg-ink); text-align: center;
    pointer-events: none;
    transition: opacity .45s ease, visibility .45s ease;
  }
  #boot-panel.is-hidden { opacity: 0; visibility: hidden; }
  #boot-panel .boot-mark { width: 150px; height: auto; filter: drop-shadow(0 2px 10px rgba(0,0,0,.75)); }
  #boot-panel .boot-ring {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25); border-top-color: #6ee7b7;
    animation: boot-spin 0.9s linear infinite;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.6));
  }
  #boot-panel.is-error .boot-ring { display: none; }
  #boot-panel.is-error .boot-mark { opacity: 0.85; }
  #boot-panel .boot-copy {
    margin: 0; max-width: 320px; font-size: 13px; line-height: 1.6;
    color: var(--wg-ink); text-shadow: 0 1px 8px rgba(0,0,0,.85);
    background: rgba(10, 17, 40, 0.55); border-radius: 10px; padding: 10px 14px;
  }
  #boot-panel.is-error .boot-copy { color: #fca5a5; }
  @keyframes boot-spin { to { transform: rotate(360deg); } }

  /* Viewfinder hint: raw camera feed stays fully visible underneath this at all times. */
  #scan-hint {
    position: fixed; inset: 24px; z-index: 500;
    pointer-events: none;
    transition: opacity .35s ease;
  }
  #scan-hint.is-hidden { opacity: 0; }
  #scan-hint .bracket { position: absolute; width: 28px; height: 28px; border-color: rgba(255,255,255,0.6); }
  #scan-hint .tl { top: 0; left: 0; border-top: 2px solid; border-left: 2px solid; border-radius: 10px 0 0 0; }
  #scan-hint .tr { top: 0; right: 0; border-top: 2px solid; border-right: 2px solid; border-radius: 0 10px 0 0; }
  #scan-hint .bl { bottom: 0; left: 0; border-bottom: 2px solid; border-left: 2px solid; border-radius: 0 0 0 10px; }
  #scan-hint .br { bottom: 0; right: 0; border-bottom: 2px solid; border-right: 2px solid; border-radius: 0 0 10px 0; }
  #scan-hint .scan-copy {
    position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
    white-space: nowrap; color: rgba(255,255,255,0.82);
    text-shadow: 0 1px 6px rgba(0,0,0,0.65);
  }

  /* Temporary: visible build marker so we can confirm a deployed copy is
     actually the version being tested, not a stale cached one. Remove once
     the AR page is stable. */
  #build-tag {
    position: fixed; top: 6px; left: 8px; z-index: 950;
    font-family: monospace; font-size: 10px; color: rgba(255,255,255,0.5);
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    pointer-events: none;
  }

  /* Belt-and-suspenders: A-Frame's own enter-VR/AR affordance has no place on
     this page (it would hijack our camera+raycaster setup) and xr-mode-ui's
     `enabled: false` above should already remove it, but force it out of the
     layout too in case anything re-shows it momentarily. */
  .a-enter-vr, .a-enter-ar { display: none !important; }

  /* No `display` override here on purpose: browsers already force
     noscript to display:none once scripting is confirmed enabled, and
     this page is JS-only, so this rule must never fight that default. */
  noscript {
    padding: 32px; text-align: center; color: var(--wg-ink);
    background: var(--wg-navy-deep); font-family: 'Inter', sans-serif;
  }
</style>
</head>
<body>

<noscript>This page needs JavaScript and camera access to show the AR card.</noscript>

<div id="build-tag">build 2026-07-26-1</div>

<div id="boot-panel">
  <img class="boot-mark" src="../assets/logo-full.svg" alt="WebGraha">
  <div class="boot-ring"></div>
  <p class="boot-copy" id="boot-copy">Starting camera…</p>
</div>

<div id="scan-hint">
  <span class="scan-copy">Point camera at the card</span>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>
</div>

<!-- renderer's comma here is deliberate, not a typo: A-Frame's attribute parser
     splits on `;` only, so `physicallyCorrectLights` never becomes its own
     property this way and silently stays at its schema default. Verified
     working camera passthrough on real Android hardware used this exact
     string; switching to the "correct" `; physicallyCorrectLights: true`
     form reproducibly broke it. Leave as-is. -->
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: false;"
  pinch-zoom
  camera-video-backdrop
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  xr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true"
>
  <a-assets timeout="15000">
    <img id="tex-earth" src="../assets/vendor/three-globe/earth-blue-marble.jpg" crossorigin="anonymous">
    <img id="tex-logo-full" src="../assets/logo-full.svg" crossorigin="anonymous">
    <img id="tex-mark" src="../assets/logo-mark.svg" crossorigin="anonymous">
    <img id="tex-linktree" src="../assets/logo-linktree.svg" crossorigin="anonymous">
  </a-assets>

  <a-camera id="viewer" position="0 0 0" look-controls="enabled: false"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .ar-hotspot; far: 50">
  </a-camera>

  <a-entity id="card-target" mindar-image-target="targetIndex: 0">
    <a-entity id="composition-root" composition-scale="near: 0.85; far: 2.5; sensitivity: 1">

      <!-- Populated at runtime -->
      <a-entity id="comet-field"></a-entity>

      <!-- Brand header, floating well above the globe, always facing the camera -->
      <a-image id="brand-header" src="#tex-logo-full" position="0 0.66 0.02" width="0.46" height="0.25"
        material="shader: flat; transparent: true; alphaTest: 0.05"
        look-at="#viewer"
        animation="property: scale; dir: alternate; loop: true; dur: 1900; to: 1.07 1.07 1.07; easing: easeInOutSine">
      </a-image>

      <!-- Earth sits at the composition's own center; Moon fully orbits it.
           Sizes/materials/timing match index-old.html's earth+moon. globe-system
           itself gets look-at (like the logo/cards already have) so it stays an
           upright-facing sphere regardless of how the marker is tilted relative
           to the camera — earth-body/moon-pivot/moon-body's own rotation
           animations are local to their own entities and compose fine underneath
           a parent that's being continuously re-oriented by look-at. -->
      <a-entity id="globe-system" position="0 0 0" look-at="#viewer">
        <a-sphere id="earth-body" radius="0.2" segments-height="48" segments-width="48"
          material="shader: standard; src: #tex-earth; roughness: 0.75; metalness: 0.08"
          animation="property: rotation; to: 0 360 0; dur: 26000; easing: linear; loop: true">
        </a-sphere>

        <!-- Full 360 orbit around Earth, tilted slightly so it reads as an
             orbit rather than a flat side-to-side pass. -->
        <a-entity id="moon-pivot" rotation="-12 0 -6"
          animation="property: rotation; to: -12 360 -6; dur: 7000; easing: linear; loop: true">
          <a-sphere id="moon-body" radius="0.05" position="-0.4 0.02 0"
            material="shader: standard; color: #b9c2cf; roughness: 0.9; metalness: 0.05"
            animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true">
          </a-sphere>
        </a-entity>
      </a-entity>

      <!-- Populated at runtime -->
      <a-entity id="link-row"></a-entity>

    </a-entity>
  </a-entity>
</a-scene>

<script>
(function () {
  'use strict';

  /* ---------- Error capture: surface real failures on-screen, since most
     testers here won't have devtools attached (phone, in-app browsers). ---------- */

  const bootPanel = document.getElementById('boot-panel');
  const bootCopy = document.getElementById('boot-copy');

  function setBoot(state, message) {
    bootPanel.classList.toggle('is-error', state === 'error');
    bootPanel.classList.toggle('is-hidden', state === 'hidden');
    if (message) bootCopy.textContent = message;
  }

  window.addEventListener('error', function (event) {
    const where = (event.filename ? event.filename.split('/').pop() : 'inline') + ':' + event.lineno;
    setBoot('error', 'Script error: ' + event.message + ' (' + where + ')');
  });
  window.addEventListener('unhandledrejection', function (event) {
    const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason);
    setBoot('error', 'Unhandled error: ' + reason);
  });

  /* ---------- Custom components (registered before the scene needs them) ---------- */

  // Two-finger pinch scales `scaleFactor`, which composition-scale below folds
  // into its own distance-based auto-scale every frame.
  AFRAME.registerComponent('pinch-zoom', {
    schema: { min: { default: 0.5 }, max: { default: 2.6 } },
    init: function () {
      this.scaleFactor = 1;
      this.lastSpan = null;
      this.onMove = this.onMove.bind(this);
      this.onLift = this.onLift.bind(this);
    },
    play: function () {
      window.addEventListener('touchmove', this.onMove, { passive: false });
      window.addEventListener('touchend', this.onLift);
      window.addEventListener('touchcancel', this.onLift);
    },
    pause: function () {
      window.removeEventListener('touchmove', this.onMove);
      window.removeEventListener('touchend', this.onLift);
      window.removeEventListener('touchcancel', this.onLift);
    },
    span: function (touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    },
    onMove: function (evt) {
      if (evt.touches.length !== 2) return;
      evt.preventDefault();
      const span = this.span(evt.touches);
      if (this.lastSpan != null) {
        const ratio = span / this.lastSpan;
        this.scaleFactor = AFRAME.THREE.MathUtils.clamp(this.scaleFactor * ratio, this.data.min, this.data.max);
      }
      this.lastSpan = span;
    },
    onLift: function (evt) {
      if (evt.touches.length < 2) this.lastSpan = null;
    }
  });

  // Whole composition auto-scales with viewing distance so it reads whether the
  // phone is close or held at arm's length, then folds in the pinch factor.
  AFRAME.registerComponent('composition-scale', {
    schema: { near: { default: 0.85 }, far: { default: 2.5 }, sensitivity: { default: 1 } },
    init: function () {
      this.cameraEl = this.el.sceneEl.camera && this.el.sceneEl.camera.el;
      this.selfPos = new AFRAME.THREE.Vector3();
      this.camPos = new AFRAME.THREE.Vector3();
    },
    tick: function () {
      if (!this.cameraEl) this.cameraEl = this.el.sceneEl.camera && this.el.sceneEl.camera.el;
      if (!this.cameraEl) return;
      this.el.object3D.getWorldPosition(this.selfPos);
      this.cameraEl.object3D.getWorldPosition(this.camPos);
      const distance = this.selfPos.distanceTo(this.camPos);
      const base = AFRAME.THREE.MathUtils.clamp(distance * this.data.sensitivity, this.data.near, this.data.far);
      const pinch = this.el.sceneEl.components['pinch-zoom'] ? this.el.sceneEl.components['pinch-zoom'].scaleFactor : 1;
      const scale = base * pinch;
      this.el.object3D.scale.set(scale, scale, scale);
    }
  });

  // Sweeps a comet streak through a tilted arc centered on the Earth by
  // rotating its pivot; radius/tilt/sweep/direction vary per spawn.
  AFRAME.registerComponent('comet-arc', {
    schema: {
      tiltX: { default: 0 },
      tiltZ: { default: 0 },
      startAngle: { default: 0 },
      sweep: { default: 180 },
      duration: { default: 1200 }
    },
    init: function () {
      this.startedAt = performance.now();
      this.done = false;
      this.el.object3D.rotation.set(
        AFRAME.THREE.MathUtils.degToRad(this.data.tiltX),
        AFRAME.THREE.MathUtils.degToRad(this.data.startAngle),
        AFRAME.THREE.MathUtils.degToRad(this.data.tiltZ)
      );
    },
    tick: function () {
      if (this.done) return;
      const elapsed = performance.now() - this.startedAt;
      const progress = Math.min(elapsed / this.data.duration, 1);
      const eased = 1 - Math.pow(1 - progress, 2);
      const angleDeg = this.data.startAngle + this.data.sweep * eased;
      this.el.object3D.rotation.y = AFRAME.THREE.MathUtils.degToRad(angleDeg);
      if (progress >= 1) {
        this.done = true;
        this.el.emit('arc-complete');
      }
    }
  });

  // Renders the camera feed as a video texture on a plane parented to the
  // camera, entirely inside the WebGL canvas, instead of relying on MindAR's
  // own separate DOM <video> + transparent-canvas-overlay technique. That
  // technique requires the browser's compositor to merge two independently
  // rendered surfaces (the video's own decode surface and the WebGL canvas),
  // which is a known-buggy path on some Android GPU/driver combinations
  // (crbug.com/1455752, crbug.com/1156408) — camera feed never appears even
  // though tracking and video acquisition both work fine. Compositing the
  // video INTO the WebGL scene as a plane sidesteps that step entirely: the
  // whole frame (video + 3D content) renders through one draw call. MindAR's
  // own video element is left running (hidden via CSS) purely as the input
  // its tracking Controller reads — this component doesn't touch tracking.
  AFRAME.registerComponent('camera-video-backdrop', {
    init: function () {
      this.plane = null;
      this.texture = null;
    },
    tick: function () {
      const sceneEl = this.el.sceneEl;
      const mindarSystem = sceneEl.systems['mindar-image-system'];
      const video = mindarSystem && mindarSystem.video;
      if (!video || !video.videoWidth || !sceneEl.camera) return;

      const camera = sceneEl.camera;

      if (!this.plane) {
        this.texture = new AFRAME.THREE.VideoTexture(video);
        if ('colorSpace' in this.texture) this.texture.colorSpace = AFRAME.THREE.SRGBColorSpace;
        const material = new AFRAME.THREE.MeshBasicMaterial({
          map: this.texture, depthTest: false, depthWrite: false, toneMapped: false
        });
        this.plane = new AFRAME.THREE.Mesh(new AFRAME.THREE.PlaneGeometry(1, 1), material);
        this.plane.renderOrder = -1000;
        this.plane.frustumCulled = false;
        camera.add(this.plane);
      }

      // Size the plane to exactly fill the frustum at a fixed distance in
      // front of the camera, recomputed every frame since MindAR itself
      // continuously adjusts camera.fov/aspect to match tracked device
      // camera intrinsics (see its own _resize()).
      const distance = (camera.near || 0.01) + 0.5;
      const vFov = AFRAME.THREE.MathUtils.degToRad(camera.fov);
      const planeHeight = 2 * Math.tan(vFov / 2) * distance;
      const planeWidth = planeHeight * camera.aspect;
      this.plane.scale.set(planeWidth, planeHeight, 1);
      this.plane.position.set(0, 0, -distance);

      // "cover" crop: compare video aspect to viewport aspect and crop the
      // texture via repeat/offset, matching CSS object-fit:cover semantics
      // (mirrors what MindAR's own _resize() does for its own DOM video).
      const videoAspect = video.videoWidth / video.videoHeight;
      const viewAspect = camera.aspect;
      if (videoAspect > viewAspect) {
        const scaleX = viewAspect / videoAspect;
        this.texture.repeat.set(scaleX, 1);
        this.texture.offset.set((1 - scaleX) / 2, 0);
      } else {
        const scaleY = videoAspect / viewAspect;
        this.texture.repeat.set(1, scaleY);
        this.texture.offset.set(0, (1 - scaleY) / 2);
      }
    }
  });

  /* ---------- Diagnostics: never leave a silent black screen ---------- */

  const scene = document.querySelector('a-scene');
  const scanHint = document.getElementById('scan-hint');

  let cameraSessionLive = false;

  scene.addEventListener('renderstart', function () { setBoot('hidden'); });
  scene.addEventListener('arReady', function () { cameraSessionLive = true; });
  scene.addEventListener('arError', function () {
    cameraSessionLive = true;
    setBoot('error', "Camera couldn't start. Check that camera access is allowed for this site in your browser settings, then reload.");
  });

  setTimeout(function () {
    if (cameraSessionLive) return;
    setBoot('error', "Still waiting on the camera. Allow camera access if a prompt appeared, then reload. If this opened inside an app's built-in browser (Instagram, WhatsApp, etc.), open it in Safari or Chrome instead.");
  }, 9000);

  const cardTarget = document.getElementById('card-target');
  cardTarget.addEventListener('targetFound', function () { scanHint.classList.add('is-hidden'); });
  cardTarget.addEventListener('targetLost', function () { scanHint.classList.remove('is-hidden'); });

  /* ---------- Link cards ---------- */

  const CARDS = [
    {
      label: 'Website', url: 'https://www.webgraha.com',
      colorFrom: '#1c2c5c', colorTo: '#31508f',
      glyph: { type: 'image', assetId: 'tex-mark' }
    },
    {
      label: 'WhatsApp', url: 'https://wa.me/917411720141',
      colorFrom: '#25D366', colorTo: '#128C7E',
      glyph: { type: 'icon', char: '', family: '"Font Awesome 6 Brands"', weight: '400' }
    },
    {
      label: 'Email', url: 'mailto:siddharth@webgraha.com',
      colorFrom: '#6ee7b7', colorTo: '#2c4c3b',
      glyph: { type: 'icon', char: '', family: '"Font Awesome 6 Free"', weight: '900' }
    },
    {
      label: 'Linktree', url: 'https://linktr.ee/webgraha',
      colorFrom: '#43E660', colorTo: '#1f7a44',
      glyph: { type: 'image', assetId: 'tex-linktree' }
    }
  ];

  function traceRoundedRect(ctx, x, y, w, h, r) {
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      return;
    }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function paintChip(def) {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');

    ctx.save();
    traceRoundedRect(ctx, 8, 8, size - 16, size - 16, 54);
    ctx.shadowColor = 'rgba(4,10,24,0.5)';
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 9;
    const bg = ctx.createLinearGradient(0, 0, size, size);
    bg.addColorStop(0, def.colorFrom);
    bg.addColorStop(1, def.colorTo);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.restore();

    traceRoundedRect(ctx, 8, 8, size - 16, (size - 16) * 0.5, 54);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fill();

    if (def.glyph.type === 'image') {
      const img = document.getElementById(def.glyph.assetId);
      const s = 104;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 8;
      ctx.drawImage(img, size / 2 - s / 2, size / 2 - s / 2 - 4, s, s);
      ctx.restore();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.font = def.glyph.weight + ' 108px ' + def.glyph.family;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 8;
      ctx.fillText(def.glyph.char, size / 2, size / 2 - 4);
    }

    return canvas.toDataURL('image/png');
  }

  // Populated by renderLinkRow, read by the native-touch fallback below.
  const hotspotRegistry = [];

  function renderLinkRow() {
    const row = document.getElementById('link-row');
    const xs = [-0.6, -0.2, 0.2, 0.6];

    CARDS.forEach(function (def, i) {
      const holder = document.createElement('a-entity');
      holder.setAttribute('position', xs[i] + ' -0.52 0.03');
      holder.setAttribute('look-at', '#viewer');

      const chip = document.createElement('a-entity');
      chip.classList.add('ar-hotspot');
      chip.setAttribute('geometry', 'primitive: plane; width: 0.25; height: 0.25');
      chip.setAttribute('material', { shader: 'flat', src: paintChip(def), transparent: true, alphaTest: 0.05 });
      chip.setAttribute('animation__enter', 'property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 460; delay: ' + (i * 80) + '; easing: easeOutBack');

      chip.addEventListener('mouseenter', function () {
        chip.setAttribute('animation__hover', 'property: scale; to: 1.14 1.14 1.14; dur: 140');
      });
      chip.addEventListener('mouseleave', function () {
        chip.setAttribute('animation__hover', 'property: scale; to: 1 1 1; dur: 140');
      });
      // Handles real mouse clicks (desktop) and any synthetic click the
      // browser still produces after a tap. touchOpenOnHit below intercepts
      // taps earlier and calls preventDefault to stop that synthesis when it
      // successfully opens a link itself, so this normally won't double-fire.
      chip.addEventListener('click', function () {
        window.open(def.url, '_blank', 'noopener');
      });

      const caption = document.createElement('a-text');
      caption.setAttribute('value', def.label);
      caption.setAttribute('align', 'center');
      caption.setAttribute('width', '0.85');
      caption.setAttribute('color', '#e7ecf5');
      caption.setAttribute('position', '0 -0.145 0');

      holder.appendChild(chip);
      holder.appendChild(caption);
      row.appendChild(holder);

      hotspotRegistry.push({ object3D: chip.object3D, url: def.url });
    });
  }

  // Mobile popup blockers generally only allow window.open() inside the
  // ORIGINAL trusted event handler chain. A-Frame's cursor component detects
  // taps via its own tick()-driven raycaster and re-dispatches a synthetic
  // 'click' event, which some mobile browsers no longer treat as a trusted
  // user gesture — window.open() silently gets blocked with no visible
  // feedback. This raycasts manually inside the native touchend handler
  // itself (still the original trusted gesture) as a more reliable path,
  // and prevents the browser's own synthetic click from double-opening.
  function initTouchOpenFallback(scene, camera) {
    const raycaster = new AFRAME.THREE.Raycaster();
    const ndc = new AFRAME.THREE.Vector2();

    scene.canvas.addEventListener('touchend', function (evt) {
      if (evt.changedTouches.length !== 1) return;
      const touch = evt.changedTouches[0];
      const rect = scene.canvas.getBoundingClientRect();
      ndc.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(ndc, camera);
      const targets = hotspotRegistry.map(function (h) { return h.object3D; });
      const hits = raycaster.intersectObjects(targets, false);
      if (hits.length === 0) return;

      const hitEntry = hotspotRegistry.find(function (h) { return h.object3D === hits[0].object; });
      if (!hitEntry) return;

      evt.preventDefault();
      window.open(hitEntry.url, '_blank', 'noopener');
    }, { passive: false });
  }

  /* ---------- Shooting stars ---------- */

  function makeCometStreakTexture() {
    const w = 160, h = 20;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');

    const trail = ctx.createLinearGradient(0, 0, w, 0);
    trail.addColorStop(0, 'rgba(255,255,255,0)');
    trail.addColorStop(0.6, 'rgba(255,255,255,0.35)');
    trail.addColorStop(1, 'rgba(255,255,255,0.95)');
    ctx.fillStyle = trail;
    ctx.fillRect(0, h / 2 - 1.5, w, 3);

    const head = ctx.createRadialGradient(w - 7, h / 2, 0, w - 7, h / 2, 10);
    head.addColorStop(0, 'rgba(255,255,255,1)');
    head.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = head;
    ctx.beginPath();
    ctx.arc(w - 7, h / 2, 10, 0, Math.PI * 2);
    ctx.fill();

    return canvas.toDataURL('image/png');
  }

  let cometStreakTexture = null;

  function spawnComet(field) {
    const tiltX = -40 + Math.random() * 80;
    const tiltZ = -28 + Math.random() * 56;
    const startAngle = Math.random() * 360;
    const sweep = (Math.random() < 0.5 ? -1 : 1) * (130 + Math.random() * 130);
    const duration = 850 + Math.random() * 700;
    const radius = 0.3 + Math.random() * 0.22;
    const length = 0.14 + Math.random() * 0.14;

    const pivot = document.createElement('a-entity');
    pivot.setAttribute('comet-arc',
      'tiltX: ' + tiltX.toFixed(1) +
      '; tiltZ: ' + tiltZ.toFixed(1) +
      '; startAngle: ' + startAngle.toFixed(1) +
      '; sweep: ' + sweep.toFixed(1) +
      '; duration: ' + duration.toFixed(0));

    const streak = document.createElement('a-entity');
    streak.setAttribute('geometry', 'primitive: plane; width: ' + length.toFixed(3) + '; height: 0.02');
    streak.setAttribute('material', { shader: 'flat', src: cometStreakTexture, transparent: true, opacity: 0, alphaTest: 0.02 });
    streak.setAttribute('position', radius.toFixed(3) + ' 0 0');
    streak.setAttribute('rotation', '0 90 0');
    streak.setAttribute('scale', '0.4 0.4 0.4');
    streak.setAttribute('animation__grow', 'property: scale; from: 0.4 0.4 0.4; to: 1 1 1; dur: ' + Math.round(duration * 0.3) + '; easing: easeOutQuad');
    streak.setAttribute('animation__fade', 'property: material.opacity; from: 0; to: 0.9; dir: alternate; dur: ' + Math.round(duration * 0.4) + '; loop: 1');

    pivot.appendChild(streak);
    field.appendChild(pivot);

    pivot.addEventListener('arc-complete', function () { pivot.remove(); });
    setTimeout(function () { if (pivot.parentNode) pivot.remove(); }, duration + 400);
  }

  function startCometLoop() {
    const field = document.getElementById('comet-field');
    (function cycle() {
      spawnComet(field);
      if (Math.random() < 0.35) setTimeout(function () { spawnComet(field); }, 200 + Math.random() * 350);
      setTimeout(cycle, 2000 + Math.random() * 2800);
    })();
  }

  /* ---------- Boot sequence ---------- */

  function iconFontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return Promise.all([
      document.fonts.load('900 64px "Font Awesome 6 Free"'),
      document.fonts.load('400 64px "Font Awesome 6 Brands"')
    ]).catch(function () {});
  }

  function sceneAssetsReady() {
    return new Promise(function (resolve) {
      if (scene.hasLoaded) resolve();
      else scene.addEventListener('loaded', resolve, { once: true });
    });
  }

  Promise.all([iconFontsReady(), sceneAssetsReady()]).then(function () {
    cometStreakTexture = makeCometStreakTexture();
    renderLinkRow();
    startCometLoop();
    initTouchOpenFallback(scene, scene.camera);
  });
})();
</script>
