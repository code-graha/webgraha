<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Camera Test — Plain getUserMedia</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
  }
  #diag {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 10px 12px; font-size: 12px; line-height: 1.6;
    color: #d1fae5; background: rgba(0,0,0,0.55);
    white-space: pre-wrap; word-break: break-word;
  }
  #diag.error { color: #fca5a5; }
</style>
</head>
<body>

<video id="feed" autoplay playsinline muted></video>
<div id="diag">Requesting camera…</div>

<script>
  var diag = document.getElementById('diag');
  var video = document.getElementById('feed');

  function log(msg, isError) {
    diag.textContent = msg;
    diag.classList.toggle('error', !!isError);
  }

  log('build 2026-07-26-cam-test\nRequesting camera (facingMode: environment)…');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    log('build 2026-07-26-cam-test\nERROR: navigator.mediaDevices.getUserMedia is not available in this browser/context.', true);
  } else {
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    }).then(function (stream) {
      video.srcObject = stream;
      var track = stream.getVideoTracks()[0];
      var settings = track ? track.getSettings() : {};
      video.addEventListener('loadedmetadata', function () {
        log(
          'build 2026-07-26-cam-test\n' +
          'STREAM OK\n' +
          'label: ' + (track ? track.label : 'n/a') + '\n' +
          'facingMode: ' + (settings.facingMode || 'n/a') + '\n' +
          'resolution: ' + video.videoWidth + 'x' + video.videoHeight + '\n' +
          'readyState: ' + video.readyState
        );
      });
    }).catch(function (err) {
      log('build 2026-07-26-cam-test\nERROR: ' + err.name + ' — ' + err.message, true);
    });
  }
</script>

</body>
</html>
